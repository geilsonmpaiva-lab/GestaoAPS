name: quality

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      SGC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:staging:config
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start -x imgproxy,logflare,vector,supavisor
      - run: npm run db:reset
      - run: npm run db:test
      - run: npx supabase db reset --local --version 202609090024 --no-seed
      - run: npx supabase migration up --local
      - run: npx supabase test db --local
